services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: nev_test
      POSTGRES_PASSWORD: nev_test_only
      POSTGRES_DB: nev_subscription_test
    ports:
      - "127.0.0.1:${AIVIZENS_TEST_PG_PORT:-55436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nev_test -d nev_subscription_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://nev_test:nev_test_only@postgres:5432/nev_subscription_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: service_role
      PGRST_JWT_SECRET: ${AIVIZENS_TEST_JWT_SECRET}
      PGRST_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:${AIVIZENS_TEST_POSTGREST_PORT:-55440}:3000"
